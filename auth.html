<!DOCTYPE html>
<html lang="ru" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Авторизация - AdminF1</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>

  <body class="bg-body-tertiary body_auth">
    <nav class="navbar bg-body py-2">
      <div
        class="container-fluid px-3 px-lg-4 d-flex justify-content-between align-items-center"
      >
        <a class="navbar-brand fs-2 fw-bold" href="index.html">AdminF1</a>

        <div class="d-flex align-items-center gap-2">
          <button
            class="btn btn-outline-secondary theme-toggle py-2 px-3 d-inline-flex align-items-center justify-content-center"
            type="button"
            aria-label="Переключить тему"
          >
            <svg
              width="30"
              height="30"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="currentColor"
            >
              <path
                d="M7.5,2C5.71,3.15 4.5,5.18 4.5,7.5C4.5,9.82 5.71,11.85 7.53,13C4.46,13 2,10.54 2,7.5A5.5,5.5 0 0,1 7.5,2M19.07,3.5L20.5,4.93L4.93,20.5L3.5,19.07L19.07,3.5M12.89,5.93L11.41,5L9.97,6L10.39,4.3L9,3.24L10.75,3.12L11.33,1.47L12,3.1L13.73,3.13L12.38,4.26L12.89,5.93M9.59,9.54L8.43,8.81L7.31,9.59L7.65,8.27L6.56,7.44L7.92,7.35L8.37,6.06L8.88,7.33L10.24,7.36L9.19,8.23L9.59,9.54M19,13.5A5.5,5.5 0 0,1 13.5,19C12.28,19 11.15,18.6 10.24,17.93L17.93,10.24C18.6,11.15 19,12.28 19,13.5M14.6,20.08L17.37,18.93L17.13,22.28L14.6,20.08M18.93,17.38L20.08,14.61L22.28,17.15L18.93,17.38M20.08,12.42L18.94,9.64L22.28,9.88L20.08,12.42M9.63,18.93L12.4,20.08L9.87,22.27L9.63,18.93Z"
              />
            </svg>
          </button>
        </div>
      </div>
    </nav>

    <div
      class="container d-flex align-items-center justify-content-center"
      style="margin-top: 150px"
    >
      <div
        class="card rounded-3 shadow-lg w-100 auth_container"
        style="max-width: 560px"
      >
        <div
          class="text-center bg-body fw-semibold fs-1 py-3 auth_name"
        >
          Авторизация
        </div>

        <div class="card-body p-5">
          <form action="index.html" method="get">
            <div class="mb-4">
              <label class="form-label fs-5 fw-medium">Логин</label>
              <div class="input-group input-group-lg">
                <input
                  type="text"
                  minlength="5"
                  maxlength="15"
                  class="form-control form-control-lg"
                  placeholder="Введите логин"
                  required
                />
              </div>
            </div>

            <div class="mb-5">
              <label class="form-label fs-5 fw-medium">Пароль</label>
              <div class="input-group input-group-lg">
                <input
                  type="password"
                  minlength="5"
                  maxlength="20"
                  class="form-control form-control-lg"
                  placeholder="Введите пароль"
                  required
                />
              </div>
            </div>

            <button
              type="submit"
              class="btn btn-outline-primary w-100 btn-lg py-2 fs-5"
            >
              Войти
            </button>
          </form>
        </div>
      </div>
    </div>

    <script src="js/theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
